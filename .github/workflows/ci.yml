name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Same MySQL, Redis and Elasticsearch versions as local development.
      - name: Start MySQL, Redis and Elasticsearch
        run: docker compose up -d --wait

      # Throwaway values for this run only; the integration tests stub Google, Slack and SMTP.
      - name: Write backend/.env
        run: |
          sed -e "s/^SESSION_SECRET=.*/SESSION_SECRET=$(openssl rand -hex 32)/" \
              -e "s/^ENCRYPTION_KEY=.*/ENCRYPTION_KEY=$(openssl rand -hex 32)/" \
              -e "s/^MAIL_TRANSPORT=.*/MAIL_TRANSPORT=log/" \
              .env.example > backend/.env

      - run: npm run db:migrate -w backend
      - run: npm run typecheck
      - run: npm run lint -w frontend
      - run: npm test
      - run: npm run build -w frontend

  docker:
    name: Build production images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: API image
        run: docker build -f backend/Dockerfile --target api -t outbox-api .
      - name: Worker image
        run: docker build -f backend/Dockerfile --target worker -t outbox-worker .
      - name: Frontend image
        run: docker build -f frontend/Dockerfile --build-arg NEXT_PUBLIC_API_URL=http://localhost:4000 -t outbox-web .
